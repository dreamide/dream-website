<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const defaultMode = "__SHISO_APPEARANCE_DEFAULT__";
        const strict = "__SHISO_APPEARANCE_STRICT__" === "true";
        let theme = defaultMode === "dark" ? "dark" : "light";
        try {
          const stored = strict ? null : localStorage.getItem("shiso-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const fallback =
            defaultMode === "system" ? (prefersDark ? "dark" : "light") : defaultMode;
          theme = stored === "dark" || stored === "light" ? stored : fallback;
        } catch {
          // Fall back to the configured default.
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="7ade14cb-bcb8-431f-9f5e-a0787c7cf311" data-domains="dreamide.app,dreamide.dev,dream.umami.is"></script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/entry-client.tsx"></script>
  </body>
</html>
