<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter";
    src: url("../../node_modules/.pnpm/@fontsource-variable+inter@5.3.0/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0a; }
  body { font-family: "Inter", sans-serif; color: #fafafa; position: relative; }

  .bg {
    position: absolute; inset: 0;
    background: url("../../public/bg-07.jpg") center -200px / 1250px auto no-repeat;
    opacity: 1;
  }
  .fade {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.7) 40%, rgba(10,10,10,0.1) 75%, rgba(10,10,10,0) 100%),
      linear-gradient(0deg, rgba(10,10,10,0.6) 0%, rgba(10,10,10,0) 40%);
  }

  .copy {
    position: absolute; left: 72px; top: 0; bottom: 0; width: 520px;
    display: flex; flex-direction: column; justify-content: center; gap: 28px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 44px; height: 44px; filter: invert(1); }
  .brand span { font-size: 22px; font-weight: 500; color: #a1a1a1; letter-spacing: -0.01em; }
  h1 {
    font-size: 150px; font-weight: 800; line-height: 0.8; letter-spacing: -0.05em;
  }
  .tag { font-size: 36px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.2; }
  .tag b { font-weight: 300; color: #bbf7d0; }
  .url {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 20px; color: #a1a1a1; font-weight: 400;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbf7d0; box-shadow: 0 0 12px #bbf7d0; }

  .shot {
    position: absolute; left: 690px; top: 262px;
    width: 1040px; aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 8px rgba(255,255,255,0.04);
    background: #0a0a0a;
  }
  .shot img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="fade"></div>
  <div class="shot"><img src="../../public/screen.png" /></div>
  <div class="copy">
    <div class="brand"><img src="../../public/dream.png" /><span>Open source · Desktop</span></div>
    <h1>DREAM</h1>
    <p class="tag">The IDE built for<br /><b>AI coding agents.</b></p>
    <div class="url"><span class="dot"></span>dreamide.dev</div>
  </div>
</body>
</html>
